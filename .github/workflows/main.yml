name: Build Samsung SM8250 Kernel

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Device Model"
        required: true
        default: "G981N"
        type: choice
        options:
          - G981N
          - G986N
          - G988N

jobs:
  build:
    name: Build ${{ inputs.model }} Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost
          sudo apt-get autoremove -y && sudo apt-get clean
          df -h /

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone KernelSU-Next
        run: |
          # .gitmodules 缺失，手动克隆 KernelSU-Next 子模块
          rm -rf KernelSU-Next
          git clone --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next.git \
            KernelSU-Next

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 zip cpio device-tree-compiler \
            clang lld llvm gcc-aarch64-linux-gnu

      - name: Setup cross-compilation toolchains
        run: |
          # GCC 交叉工具链：用系统 aarch64-linux-gnu-* 创建符号链接
          # 映射到 build.sh 期望的 aarch64-linux-android-* 路径
          BIN_DIR="toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin"
          mkdir -p "$BIN_DIR"
          for tool in gcc g++ ar as ld nm objcopy objdump ranlib strip readelf size; do
            ln -sf "/usr/bin/aarch64-linux-gnu-$tool" "$BIN_DIR/aarch64-linux-android-$tool"
          done

          # Clang：用系统 clang 代替 Samsung llvm-arm-toolchain-ship 10.0
          mkdir -p toolchain/llvm-arm-toolchain-ship/10.0/bin
          ln -sf "$(which clang)" toolchain/llvm-arm-toolchain-ship/10.0/bin/clang

      - name: Fix OpenSSL 3.0 compatibility
        run: |
          # 内核 4.19 的 scripts/sign-file.c 使用了 OpenSSL 3.0 中已废弃的 API
          # 在 KBUILD_HOSTCFLAGS 中添加 -Wno-deprecated-declarations 防止编译失败
          sed -i 's/KBUILD_HOSTCFLAGS   :=/KBUILD_HOSTCFLAGS   := -Wno-deprecated-declarations/' Makefile

      - name: Fix file permissions
        run: |
          chmod +x build.sh
          chmod +x tools/dtc 2>/dev/null || true
          find AIK_* -name "*.sh" -exec chmod +x {} \;
          find AIK_*/bin -type f -exec chmod +x {} \; 2>/dev/null || true

      - name: Build kernel
        run: |
          # 抑制新版 clang 产生的警告（三星的 "forbidden warning" 机制会将其当作致命错误）
          export KCFLAGS="-Wno-unused-but-set-variable -Wno-unused-but-set-parameter"
          bash build.sh ${{ inputs.model }}

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.model }}-SuSFS-kernel
          path: gorhanhee/*.tar
          if-no-files-found: error
          retention-days: 30
